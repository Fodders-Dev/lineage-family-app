name: Production Watch

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Run backend tests
        run: |
          node --test backend/test/config-env.test.js backend/test/postgres-store.test.js
          node --test backend/test/api.test.js

      - name: Create backend release archive
        run: |
          cd backend
          tar \
            --exclude=node_modules \
            --exclude=data \
            --exclude=test \
            --exclude=.gitignore \
            -czf ../rodnya-backend.tgz .

      - name: Setup server auth
        # Только ключевая аутентификация: парольные ветки (sshpass +
        # BACKEND_SERVER_PASSWORD) удалены 31.08.2026 вместе с переездом —
        # секрет удалён, а на новом сервере парольный ssh отключён, так что
        # ветка была мёртвой и лишь просила StrictHostKeyChecking=no.
        # Pass every secret via env: + reference $VAR in shell —
        # never `${{ secrets.X }}` interpolated into the rendered
        # script body. Same hardening as backend-deploy /
        # flutter-web-deploy.
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set +x
          mkdir -p ~/.ssh
          printenv SERVER_SSH_KEY > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 5 -H "$SERVER_HOST" >> ~/.ssh/known_hosts || true

      - name: Upload backend archive
        env:
          REMOTE_ARCHIVE: /tmp/rodnya-backend-${{ github.sha }}.tgz
          REMOTE_SCRIPT: /tmp/rodnya-activate-backend-release-${{ github.sha }}.sh
          BACKEND_SERVER_USERNAME: ${{ secrets.BACKEND_SERVER_USERNAME }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set +x
          backend_user="${BACKEND_SERVER_USERNAME:-$SERVER_USERNAME}"
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes rodnya-backend.tgz \
            "${backend_user}@$SERVER_HOST:${REMOTE_ARCHIVE}"
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            deploy/backend/activate_backend_release.sh \
            "${backend_user}@$SERVER_HOST:${REMOTE_SCRIPT}"

      - name: Activate backend release on server
        id: activate_backend_release
        continue-on-error: true
        env:
          REMOTE_ARCHIVE: /tmp/rodnya-backend-${{ github.sha }}.tgz
          REMOTE_SCRIPT: /tmp/rodnya-activate-backend-release-${{ github.sha }}.sh
          BACKEND_SERVER_USERNAME: ${{ secrets.BACKEND_SERVER_USERNAME }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set +x
          DEPLOY_LABEL="deploy ${GITHUB_SHA::7} / github-actions-backend / $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          backend_user="${BACKEND_SERVER_USERNAME:-$SERVER_USERNAME}"
          ssh_cmd=(ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "${backend_user}@$SERVER_HOST")
          "${ssh_cmd[@]}" bash -s -- "${REMOTE_ARCHIVE}" "${REMOTE_SCRIPT}" "/opt/rodnya/backend" "rodnya-backend.service" "${DEPLOY_LABEL}" <<'EOF'
          set -euo pipefail
          archive="$1"
          script="$2"
          target="$3"
          service="$4"
          label="$5"
          chmod +x "$script"
          BUILD_LABEL="$label" "$script" "$archive" "$target" "$service"
          rm -f "$archive" "$script"
          EOF

      - name: Capture backend diagnostics after failed activation
        if: steps.activate_backend_release.outcome != 'success'
        env:
          BACKEND_SERVER_USERNAME: ${{ secrets.BACKEND_SERVER_USERNAME }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set +x
          backend_user="${BACKEND_SERVER_USERNAME:-$SERVER_USERNAME}"
          ssh_cmd=(ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "${backend_user}@$SERVER_HOST")
          "${ssh_cmd[@]}" bash -s <<'EOF'
          set -euo pipefail
          echo "=== systemctl status ==="
          systemctl status rodnya-backend.service --no-pager --full || true
          echo "=== journalctl ==="
          journalctl -u rodnya-backend.service -n 200 --no-pager || true
          echo "=== ready ==="
          curl -sS -D - http://127.0.0.1:8080/ready || true
          EOF

      - name: Fail when backend activation did not succeed
        if: steps.activate_backend_release.outcome != 'success'
        run: exit 1

      - name: Backend readiness check
        env:
          RODNYA_READY_ALERT_WEBHOOK_URL: ${{ secrets.RODNYA_READY_ALERT_WEBHOOK_URL }}
        run: node tool/backend_ready_alert.mjs --url https://api.rodnya-tree.ru/ready --fail-on-warnings

      - name: Backend runtime watch
        env:
          RODNYA_RUNTIME_API_URL: https://api.rodnya-tree.ru
          RODNYA_RUNTIME_EMAIL: ${{ secrets.RODNYA_RUNTIME_EMAIL }}
          RODNYA_RUNTIME_PASSWORD: ${{ secrets.RODNYA_RUNTIME_PASSWORD }}
          RODNYA_RUNTIME_ALERT_WEBHOOK_URL: ${{ secrets.RODNYA_RUNTIME_ALERT_WEBHOOK_URL }}
          RODNYA_READY_ALERT_WEBHOOK_URL: ${{ secrets.RODNYA_READY_ALERT_WEBHOOK_URL }}
        run: node tool/backend_runtime_watch.mjs --fail-on-warnings

      - name: Install smoke tooling
        run: |
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Select smoke browser
        timeout-minutes: 2
        run: |
          set -euo pipefail
          chrome_path="$(
            command -v google-chrome ||
            command -v google-chrome-stable ||
            command -v chromium-browser ||
            command -v chromium
          )"
          "$chrome_path" --version
          echo "RODNYA_SMOKE_CHROMIUM_EXECUTABLE_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Route smoke
        env:
          RODNYA_SMOKE_BASE_URL: https://rodnya-tree.ru
          RODNYA_SMOKE_API_URL: https://api.rodnya-tree.ru
          RODNYA_SMOKE_EMAIL: ${{ secrets.RODNYA_SMOKE_EMAIL }}
          RODNYA_SMOKE_PASSWORD: ${{ secrets.RODNYA_SMOKE_PASSWORD }}
          RODNYA_SMOKE_PARTNER_EMAIL: ${{ secrets.RODNYA_SMOKE_PARTNER_EMAIL }}
          RODNYA_SMOKE_PARTNER_PASSWORD: ${{ secrets.RODNYA_SMOKE_PARTNER_PASSWORD }}
          RODNYA_SMOKE_DISPLAY_NAME: Rodnya Smoke
          RODNYA_SMOKE_TREE_NAME: Rodnya Smoke Tree
          RODNYA_SMOKE_AUTO_REGISTER: "1"
          RODNYA_SMOKE_FIXTURE_TREE_ID: ${{ secrets.RODNYA_SMOKE_FIXTURE_TREE_ID }}
          RODNYA_SMOKE_CLAIM_URL: ${{ secrets.RODNYA_SMOKE_CLAIM_URL }}
          RODNYA_SMOKE_INVITE_URL: ${{ secrets.RODNYA_SMOKE_INVITE_URL }}
        run: node tool/prod_route_smoke.mjs --suite all --output-json output/playwright/prod-route-smoke.watch.json

      - name: Backup restore precheck
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
        run: |
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USERNAME" ] || [ ! -f ~/.ssh/id_ed25519 ]; then
            echo "Skipping backup restore precheck: SSH context is not configured."
            exit 0
          fi
          ssh -i ~/.ssh/id_ed25519 "${SERVER_USERNAME}@${SERVER_HOST}" \
            'bash -s -- /opt/rodnya/backups /tmp/rodnya-backup-watch' \
            < deploy/backend/verify_backup_restore_drill.sh

      - name: Upload watch artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-watch
          path: output/playwright
          if-no-files-found: ignore
