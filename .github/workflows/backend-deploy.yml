name: Deploy Rodnya Backend

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/backend-deploy.yml"
      - "backend/**"
      - "deploy/backend/**"
      - "tool/backend_ready_alert.mjs"
      - "tool/backend_runtime_watch.mjs"

# Cancel in-flight deploys when a newer push lands. Prevents a slow
# / hung run from blocking the next attempt — the most recent push
# is always what we want in production, older ones are noise.
concurrency:
  group: backend-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Bound the whole job so a hung test (e.g. a regressed call latency that
    # blocks a request) fails CI in minutes instead of burning the runner.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install backend dependencies
        working-directory: backend
        # --no-audit: audit-эндпоинт registry 04.09.2026 лежал (503 через
        # 120 с), и этот шаг ждал его ~5 минут ради ничего — тесты и архив
        # от аудита не зависят.
        run: npm ci --no-audit --no-fund

      - name: Run backend tests
        run: |
          node --test --test-timeout=30000 \
            backend/test/media-storage.test.js \
            backend/test/app-media-routes.test.js \
            backend/test/api.test.js \
            backend/test/postgres-store.test.js \
            backend/test/chat-utils.test.js

      - name: Create backend release archive
        run: |
          tar \
            --exclude=node_modules \
            --exclude=data \
            --exclude=test \
            --exclude=.gitignore \
            -czf rodnya-backend.tgz \
            -C backend .

      - name: Setup server auth
        # Ключевая аутентификация (SERVER_SSH_KEY), как в production-watch:
        # парольный путь умер вместе со старым сервером (август 2026).
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set +x
          mkdir -p ~/.ssh
          printenv SERVER_SSH_KEY > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload backend release archive
        # Скрипт активации едет вместе с архивом — ИЗ РЕПО
        # (deploy/backend/activate_backend_release.sh), как в
        # production-watch. Серверная копия /usr/local/bin/... успела
        # отстать на пять месяцев (без --no-audit), и 04.09.2026 деплой
        # повис на лежащем audit-эндпоинте registry. Источник истины —
        # один, репо.
        env:
          REMOTE_ARCHIVE: /tmp/rodnya-backend-${{ github.sha }}.tgz
          REMOTE_SCRIPT: /tmp/rodnya-activate-backend-release-${{ github.sha }}.sh
          BACKEND_SERVER_USERNAME: ${{ secrets.BACKEND_SERVER_USERNAME }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set +x
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes rodnya-backend.tgz \
            "${BACKEND_SERVER_USERNAME}@$SERVER_HOST:${REMOTE_ARCHIVE}"
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            deploy/backend/activate_backend_release.sh \
            "${BACKEND_SERVER_USERNAME}@$SERVER_HOST:${REMOTE_SCRIPT}"

      - name: Activate backend release on server
        # The activation script does its real work in <30 s
        # (extract → npm ci --omit=dev → systemctl restart →
        # readiness check). When the SSH session occasionally
        # hangs on cleanup post-`systemctl restart` (the new
        # backend process inherits the SSH stdin/stdout fds and
        # SSH waits forever), this step would idle for hours
        # holding GitHub minutes. Cap it at 5 min — enough for
        # any legitimate deploy, short enough that a hang
        # surfaces as a clear failure instead of pretending to
        # still be running.
        timeout-minutes: 5
        env:
          REMOTE_ARCHIVE: /tmp/rodnya-backend-${{ github.sha }}.tgz
          REMOTE_SCRIPT: /tmp/rodnya-activate-backend-release-${{ github.sha }}.sh
          BACKEND_TARGET_DIR: /opt/rodnya/backend
          BACKEND_SERVICE_NAME: rodnya-backend.service
          BACKEND_SERVER_USERNAME: ${{ secrets.BACKEND_SERVER_USERNAME }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set +x
          DEPLOY_LABEL="deploy ${GITHUB_SHA::7} / github-actions-backend / $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "${BACKEND_SERVER_USERNAME}@$SERVER_HOST" \
            bash -s -- "${REMOTE_ARCHIVE}" "${REMOTE_SCRIPT}" "${BACKEND_TARGET_DIR}" "${BACKEND_SERVICE_NAME}" "${DEPLOY_LABEL}" <<'EOF'
          set -euo pipefail
          archive="$1"
          script="$2"
          target="$3"
          service="$4"
          label="$5"
          chmod +x "$script"
          if [ "$(id -u)" -eq 0 ]; then
            "$script" "$archive" "$target" "$service" "$label"
          else
            sudo -n "$script" "$archive" "$target" "$service" "$label"
          fi
          rm -f "$archive" "$script"
          EOF

      - name: Backend readiness check
        env:
          RODNYA_READY_ALERT_WEBHOOK_URL: ${{ secrets.RODNYA_READY_ALERT_WEBHOOK_URL }}
        run: node tool/backend_ready_alert.mjs --url https://api.rodnya-tree.ru/ready --fail-on-warnings

      - name: Backend runtime watch
        env:
          RODNYA_RUNTIME_API_URL: https://api.rodnya-tree.ru
          RODNYA_RUNTIME_EMAIL: ${{ secrets.RODNYA_RUNTIME_EMAIL }}
          RODNYA_RUNTIME_PASSWORD: ${{ secrets.RODNYA_RUNTIME_PASSWORD }}
          RODNYA_RUNTIME_ALERT_WEBHOOK_URL: ${{ secrets.RODNYA_RUNTIME_ALERT_WEBHOOK_URL }}
          RODNYA_READY_ALERT_WEBHOOK_URL: ${{ secrets.RODNYA_READY_ALERT_WEBHOOK_URL }}
        run: node tool/backend_runtime_watch.mjs --fail-on-warnings
