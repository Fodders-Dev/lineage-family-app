buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // AGP 8.9.1 to satisfy androidx libs (activity 1.12.4 /
        // core 1.18.0 / navigationevent 1.0.2) that started requiring
        // it after a transitive dependency bump. Gradle wrapper bumped
        // in lockstep to 8.11.1 (the minimum AGP 8.9.x supports).
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.4'
    }
}

allprojects {
    repositories {
        // RuStore SDK: свой Maven-репозиторий (artifactory-external.
        // vkpartner.ru) 01.09.2026 перестал отвечать (404 даже на ping),
        // а jitpack на эти координаты отвечает 401 — Gradle считает это
        // жёсткой ошибкой, и релизная сборка падала. Зеркало лежит в
        // репо (~5 МБ) и объявлено ПЕРВЫМ и только для этой группы:
        // сборка перестаёт зависеть от чужого Artifactory.
        maven {
            url = uri("${rootDir}/rustore-maven")
            content { includeGroup("ru.rustore.sdk") }
        }
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
